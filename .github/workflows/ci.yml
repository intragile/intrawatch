name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: shivammathur/setup-php@v2
        timeout-minutes: 5
        with:
          php-version: '8.4'
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        timeout-minutes: 2
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        timeout-minutes: 5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress
        timeout-minutes: 10

      - name: Pint
        timeout-minutes: 5
        run: vendor/bin/pint --test

      - name: PHPStan
        timeout-minutes: 10
        run: vendor/bin/phpstan analyse --memory-limit=1G

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql, pgsql]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: intrawatch
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: intrawatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_DATABASE: ${{ matrix.db == 'sqlite' && ':memory:' || 'intrawatch' }}
      DB_PORT: ${{ matrix.db == 'mysql' && '3306' || matrix.db == 'pgsql' && '5432' || '' }}
      DB_USERNAME: ${{ matrix.db == 'mysql' && 'root' || matrix.db == 'pgsql' && 'postgres' || '' }}
      DB_PASSWORD: ${{ matrix.db == 'sqlite' && '' || 'secret' }}

    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: shivammathur/setup-php@v2
        timeout-minutes: 5
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        timeout-minutes: 2
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        timeout-minutes: 5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress
        timeout-minutes: 10

      - name: Test (${{ matrix.db }})
        timeout-minutes: 15
        run: php artisan test

      - name: OpenAPI spec is current
        if: matrix.db == 'sqlite'
        timeout-minutes: 5
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ runner.temp }}/spec.sqlite
        run: |
          touch "$DB_DATABASE"
          php artisan migrate --force
          php artisan scramble:export --path=/tmp/o.json
          diff -q /tmp/o.json docs/openapi.json

      # CHANGELOG.md parses and every translation (CHANGELOG.hu.md) has its versions and dates.
      - name: Changelog check
        if: matrix.db == 'sqlite'
        timeout-minutes: 2
        run: php artisan changelog:check --locale=hu

      # resources/manual: every chapter in _meta.php exists in hu and en with the same block structure,
      # and its manual, route and link tokens resolve.
      - name: Manual check
        if: matrix.db == 'sqlite'
        timeout-minutes: 2
        run: php artisan manual:check

  spa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: spa
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: spa/package-lock.json

      - run: npm ci --no-audit --no-fund
        timeout-minutes: 10

      # Lint, typecheck, API type drift, unit tests (serially: parallel files trip vitest's 5s timeouts on a
      # shared runner) and the build: the same gate as a local release check.
      - name: npm run verify
        timeout-minutes: 15
        run: npm run verify

  docker-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - name: build-image.sh --out checks
        timeout-minutes: 3
        run: bash tests/docker/build-image-test.sh

      - name: Entrypoint test
        timeout-minutes: 10
        run: bash tests/docker/entrypoint-test.sh

  # One image build feeds both smoke runs and the Playwright e2e run: the scripts skip their own build
  # (SMOKE_SKIP_BUILD / E2E_SKIP_BUILD) and keep the image, so the ~10 minute build happens once.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      IMAGE: intrawatch:ci
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Build the image
        timeout-minutes: 30
        run: docker build -f docker/Dockerfile -t "$IMAGE" .

      - name: Smoke test the image (sqlite)
        timeout-minutes: 15
        env:
          SMOKE_SKIP_BUILD: '1'
          SMOKE_IMAGE: ${{ env.IMAGE }}
        run: bash tests/docker/smoke.sh

      - name: Smoke test the image (pgsql)
        timeout-minutes: 15
        env:
          SMOKE_SKIP_BUILD: '1'
          SMOKE_IMAGE: ${{ env.IMAGE }}
        run: bash tests/docker/smoke.sh --pgsql

      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: spa/package-lock.json

      - name: Install SPA dependencies and Chromium
        timeout-minutes: 10
        working-directory: spa
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: E2E (Playwright against the image)
        timeout-minutes: 16
        env:
          E2E_SKIP_BUILD: '1'
          E2E_IMAGE: ${{ env.IMAGE }}
        run: bash spa/e2e/run.sh

      - name: Upload Playwright traces
        if: failure()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: spa/test-results
          if-no-files-found: ignore
          retention-days: 7
