[supervisord]
nodaemon=true
; Without silent, nodaemon mode would echo every log line a second time.
silent=true
user=app
; supervisord's own log (program state changes, FATAL) goes to the container log.
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

; A program that keeps dying within startsecs is retried startretries times and then marked FATAL; the
; listener below then stops supervisord, the container exits non-zero and the restart policy recovers it.
[program:web]
command=frankenphp run --config /etc/caddy/Caddyfile --adapter caddyfile
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
command=php artisan queue:work --sleep=1 --tries=3 --max-time=3600
directory=/app
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Day rollup rebuilds can run for up to 900 s; a worker of their own keeps them from delaying regular jobs.
; A rebuild cut short by a stop is left half done (each day is replaced atomically) and is not retried.
[program:queue-long]
command=php artisan queue:work long --queue=long --sleep=3 --timeout=900 --max-time=3600
directory=/app
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; One process per local shard. A worker drains in about 6 s at most (4 s for checks in flight, 2 s to write
; buffered outcomes); stopwaitsecs is the hard limit before SIGKILL.
[program:checker]
command=/usr/local/bin/checker.sh %(process_num)s
process_name=%(program_name)s_%(process_num)s
numprocs=%(ENV_CHECK_WORKERS)s
directory=/app
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php artisan schedule:work
directory=/app
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:reverb]
; Loopback only: clients reach it through Caddy on port 3000 (/app), the application publishes directly.
command=php artisan reverb:start --host=127.0.0.1 --port=8080
directory=/app
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; supervisord stops groups one after another, but the processes of one group together. A single group makes
; every program stop in parallel, so the container stops within the 10 s that `docker stop` allows by default.
[group:intrawatch]
programs=web,queue,queue-long,checker,scheduler,reverb

[eventlistener:fatal-exit]
command=python3 /usr/local/bin/supervisor-fatal-exit
events=PROCESS_STATE_FATAL
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
