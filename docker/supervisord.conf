[supervisord]
nodaemon=true
; Without silent, nodaemon mode would echo every log line a second time.
silent=true
user=app
; supervisord's own log (program state changes, FATAL) goes to the container log.
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

; A program that keeps dying within startsecs is retried startretries times and then marked FATAL; the
; listener below then stops supervisord, the container exits non-zero and the restart policy recovers it.
[program:web]
command=frankenphp run --config /etc/caddy/Caddyfile --adapter caddyfile
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
command=php artisan queue:work --sleep=1 --tries=3 --max-time=3600
directory=/app
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php artisan schedule:work
directory=/app
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:reverb]
; Loopback only: clients reach it through Caddy on port 3000 (/app), the application publishes directly.
command=php artisan reverb:start --host=127.0.0.1 --port=8080
directory=/app
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[eventlistener:fatal-exit]
command=python3 /usr/local/bin/supervisor-fatal-exit
events=PROCESS_STATE_FATAL
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
