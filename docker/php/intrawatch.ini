; Import uploads (Uptime Kuma databases). The application limit is IMPORT_MAX_UPLOAD_MB (default 256);
; these PHP limits are the ceiling it can be raised to. Larger databases go through the command-line importer.
upload_max_filesize = 512M
post_max_size = 520M

; No X-Powered-By header announcing the PHP version.
expose_php = Off

; `docker exec php ...` runs with the same umask (027) as the services, see cli-umask.php.
auto_prepend_file = /usr/local/etc/php/cli-umask.php
