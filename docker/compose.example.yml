# Minimal IntraWatch deployment. SQLite is the default and needs nothing else.
services:
  intrawatch:
    image: ghcr.io/intragile/intrawatch:latest
    ports:
      - "3000:3000"
    volumes:
      - intrawatch-data:/data
    environment:
      # Public URL; its host is accepted for cookie sessions by default.
      APP_URL: http://localhost:3000
      # TRUSTED_PROXIES: "*"            # set when running behind a reverse proxy
      # SESSION_SECURE_COOKIE: "true"   # set when served over HTTPS
      # SANCTUM_STATEFUL_DOMAINS: status.example.com
      # --- Check workers (see the README); several hosts need an external database ---
      # CHECK_WORKERS: "1"
      # CHECK_SHARD_OFFSET: "0"
      # CHECK_SHARDS_TOTAL: "1"
      # CHECK_BLOCKED_NETWORKS: "169.254.169.254/32,fd00:ec2::254/128,10.0.0.0/8"
      # --- Outgoing e-mail for e-mail notification channels that have no SMTP server of their own ---
      # MAIL_MAILER: smtp
      # MAIL_HOST: smtp.example.com
      # MAIL_PORT: 587
      # MAIL_USERNAME: alerts@example.com
      # MAIL_PASSWORD: change-me
      # MAIL_FROM_ADDRESS: alerts@example.com
      # DB_SQLITE_JOURNAL_MODE: DELETE  # when /data is on NFS or another network file system
      # --- PostgreSQL instead of SQLite ---
      # DB_CONNECTION: pgsql
      # DB_HOST: postgres
      # DB_PORT: 5432
      # DB_DATABASE: intrawatch
      # DB_USERNAME: intrawatch
      # DB_PASSWORD: change-me
      # --- MySQL / MariaDB instead of SQLite ---
      # DB_CONNECTION: mysql
      # DB_HOST: mysql
      # DB_PORT: 3306
      # DB_DATABASE: intrawatch
      # DB_USERNAME: intrawatch
      # DB_PASSWORD: change-me
    # Required: the container exits when an internal program fails permanently.
    restart: unless-stopped
    # Check workers write their buffered results on shutdown; the container stops within 10 s.
    stop_grace_period: 10s
