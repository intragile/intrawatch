  #     MYSQL_DATABASE: intrawatch
  #     MYSQL_USER: intrawatch
  #     MYSQL_PASSWORD: change-me
  #     MYSQL_RANDOM_ROOT_PASSWORD: "yes"
  #   volumes:
  #     - mysql-data:/var/lib/mysql
  #   restart: unless-stopped

volumes:
  intrawatch-data:
